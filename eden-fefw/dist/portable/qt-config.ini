; Fresh portable settings for Fire Emblem: Fortune's Weave.

[Core]
memory_layout_mode\default=false
memory_layout_mode=4

[System]
use_docked_mode\default=false
use_docked_mode=1

[Renderer]
backend\default=false
backend=1
resolution_setup\default=false
resolution_setup=3
scaling_filter\default=false
scaling_filter=1
anti_aliasing\default=false
anti_aliasing=2
gpu_accuracy\default=false
gpu_accuracy=0
force_max_clock\default=false
force_max_clock=true
sync_memory_operations\default=false
sync_memory_operations=true
accelerate_astc\default=false
accelerate_astc=1
astc_recompression\default=false
astc_recompression=2
use_asynchronous_gpu_emulation\default=false
use_asynchronous_gpu_emulation=true
async_presentation\default=false
async_presentation=true
use_asynchronous_shaders\default=false
use_asynchronous_shaders=true
use_disk_shader_cache\default=false
use_disk_shader_cache=true

[Debugging]
use_auto_stub\default=false
use_auto_stub=true

[Miscellaneous]
log_filter\default=false
log_filter="*:Info"

[UI]
check_for_updates\default=false
check_for_updates=false
